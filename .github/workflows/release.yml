name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Check formatting
      run: npx prettier --check nodes credentials tests package.json

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        if [ ! -f "dist/nodes/SmtpServerMultiUserTrigger/SmtpServerMultiUserTrigger.node.js" ]; then
          echo "Build output not found!"
          exit 1
        fi
        echo "Build verification passed"

    - name: Verify tag matches package version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}"
          exit 1
        fi
        echo "Tag and package version match"

    - name: Check npm version
      id: npm_version
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
        fi

    - name: Publish to npm
      if: steps.npm_version.outputs.exists != 'true'
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Verify npm publication
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        for attempt in $(seq 1 60); do
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Published ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            exit 0
          fi
          echo "Waiting for npm to publish ${PACKAGE_NAME}@${PACKAGE_VERSION} (attempt ${attempt}/60)..."
          sleep 10
        done
        echo "Timed out waiting for npm publication"
        exit 1

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "Release ${GITHUB_REF_NAME}" \
          --generate-notes
